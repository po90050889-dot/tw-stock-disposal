name: Daily Update Disposal Page

on:
  schedule:
    # UTC 10:07 = 台灣時間 18:07，每天（含週末，避免漏接假日發布的重大訊息）。
    # 刻意避開整點（10:00）：GitHub Actions 官方文件提到整點是排程尖峰，負載過高時
    # 佇列中的排程任務可能直接被丟棄、不會補跑，錯開幾分鐘可以降低撞到尖峰的機率。
    - cron: "7 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate disposal.html
        run: python fetch_and_render.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/disposal.html output/index.html data/material_info.json
          git diff --cached --quiet || git commit -m "chore: update disposal.html $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send Telegram notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 尚未設定（repo Settings -> Secrets and variables -> Actions），略過推播。"
            exit 0
          fi
          if [ ! -f output/summary.txt ]; then
            echo "找不到 output/summary.txt，略過推播。"
            exit 0
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="$(cat output/summary.txt)"

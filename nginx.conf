server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index disposal.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # 代理 Google 新聞 RSS：瀏覽器直接跨網域讀取會被 CORS 擋掉，
    # 由同源的 nginx 轉發並補上 CORS header，前端才能 fetch() 讀到內容。
    # 僅限個人／非商業用途查閱，需遵守 Google 新聞 RSS 的使用條款。
    location /api/news {
        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        proxy_pass https://news.google.com/rss/search$is_args$args;
        proxy_set_header Host news.google.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36";
        proxy_ssl_server_name on;
        proxy_read_timeout 10s;
        add_header Access-Control-Allow-Origin * always;
        add_header Content-Type "application/xml; charset=utf-8" always;
    }
}
